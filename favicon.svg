<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140d21"/>
      <stop offset="100%" stop-color="#2a1447"/>
    </linearGradient>
    <linearGradient id="book-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <linearGradient id="page-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5d0fe"/>
      <stop offset="100%" stop-color="#e9d5ff"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>

  <!-- Book Container with Glow & Shadow -->
  <g filter="url(#shadow)">
    <!-- Back Cover -->
    <path d="M 256 120 C 190 85 110 80 64 90 L 64 395 C 110 385 190 390 256 425 C 322 390 402 385 448 395 L 448 90 C 402 80 322 85 256 120 Z" fill="url(#book-grad)"/>

    <!-- Left Book Pages -->
    <path d="M 256 135 C 195 105 125 100 80 110 L 80 375 C 125 365 195 370 256 402 Z" fill="url(#page-grad)"/>

    <!-- Right Book Pages -->
    <path d="M 256 135 C 317 105 387 100 432 110 L 432 375 C 387 365 317 370 256 402 Z" fill="#fae8ff"/>

    <!-- Central Spine Ridge -->
    <path d="M 252 130 L 260 130 L 260 410 L 252 410 Z" fill="#581c87" opacity="0.6"/>

    <!-- Golden Bookmark Ribbon -->
    <path d="M 236 85 L 276 85 L 276 250 L 256 225 L 236 250 Z" fill="url(#ribbon)"/>
    <path d="M 236 85 L 276 85 L 276 92 L 236 92 Z" fill="#fbbf24"/>
  </g>
</svg>
